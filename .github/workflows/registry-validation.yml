name: Registry validation

on:
  push:
    paths:
      - "registry/**"
      - "docs/**"
      - "checkpoints/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "llms.txt"
      - "manifest.json"
      - "capabilities.json"
      - "compatibility.json"
      - "PORTFOLIO-STATUS.md"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "templates/**"
      - "prototypes/**"
      - "examples/**"
      - "specifications/**"
      - "provisioning/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "registry/**"
      - "docs/**"
      - "checkpoints/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "llms.txt"
      - "manifest.json"
      - "capabilities.json"
      - "compatibility.json"
      - "PORTFOLIO-STATUS.md"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "templates/**"
      - "prototypes/**"
      - "examples/**"
      - "specifications/**"
      - "provisioning/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate registry and dependency graph
        run: python tools/validate_registry.py
      - name: Validate resource manifest example
        run: python tools/validate_agent_resource.py
      - name: Smoke-test default-deny policy evaluator
        run: python tools/evaluate_policy.py --policy prototypes/policy/examples/policy.json --request prototypes/policy/examples/allow-request.json
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run entry-level build
        run: python tools/starter_build.py
