name: Registry validation

on:
  push:
    paths:
      - "registry/**"
      - "docs/**"
      - "checkpoints/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "llms.txt"
      - "manifest.json"
      - "capabilities.json"
      - "compatibility.json"
      - "PORTFOLIO-STATUS.md"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "templates/**"
      - "prototypes/**"
      - "examples/**"
      - "specifications/**"
      - "provisioning/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "registry/**"
      - "docs/**"
      - "checkpoints/**"
      - "README.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "llms.txt"
      - "manifest.json"
      - "capabilities.json"
      - "compatibility.json"
      - "PORTFOLIO-STATUS.md"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "templates/**"
      - "prototypes/**"
      - "examples/**"
      - "specifications/**"
      - "provisioning/**"
      - "requirements-dev.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate registry and dependency graph
        run: python tools/validate_registry.py
      - name: Validate resource manifest example
        run: python tools/validate_agent_resource.py
      - name: Smoke-test default-deny policy evaluator
        run: python tools/evaluate_policy.py --policy prototypes/policy/examples/policy.json --request prototypes/policy/examples/allow-request.json
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run entry-level build
        run: python tools/starter_build.py

  emergency-control-staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install emergency-control validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: provisioning/staged/agent-emergency-control
      - name: Run emergency-control staging tests
        run: python -m unittest discover -s tests -v
        working-directory: provisioning/staged/agent-emergency-control

  compliance-governance-staging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compliance-governance validation dependency
        run: python -m pip install -r requirements-dev.txt
        working-directory: provisioning/staged/agent-compliance-governance
      - name: Validate compliance governance registries
        run: python -m compliance_governance.validate_registry
        working-directory: provisioning/staged/agent-compliance-governance
      - name: Run compliance-governance staging tests
