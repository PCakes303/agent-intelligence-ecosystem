name: Registry validation

on:
  push:
    paths:
      - "registry/**"
      - "schemas/**"
      - ".github/workflows/registry-validation.yml"
  pull_request:
    paths:
      - "registry/**"
      - "schemas/**"
      - ".github/workflows/registry-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate registry and dependency graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(".")
          registry = json.loads((root / "registry/repositories.json").read_text())
          schema = json.loads((root / "schemas/repository-registry.schema.json").read_text())
          Draft202012Validator(schema).validate(registry)

          repos = registry["repositories"]
          ids = [r["id"] for r in repos]
          names = [r["name"] for r in repos]
          assert len(ids) == len(set(ids)), "duplicate repository IDs"
          assert len(names) == len(set(names)), "duplicate repository names"
          id_set = set(ids)
          for repo in repos:
              missing = set(repo["dependencies"]) - id_set
              assert not missing, f'{repo["id"]}: unknown dependencies {sorted(missing)}'
              if repo["visibility"] == "private":
                  assert repo.get("public_export", False) is False, "private repo cannot be public-exported"

          graph = json.loads((root / "registry/dependencies.json").read_text())
          assert graph["excluded"] == ["private-operations"], "private repo must remain excluded"
          edges = graph["edges"]
          for source, target in edges:
              assert source in id_set and target in id_set, f"unknown graph node: {source}->{target}"
              assert source != "private-operations" and target != "private-operations", "private node leaked into public graph"
          adjacency = {node: [] for node in id_set}
          for source, target in edges:
              adjacency[source].append(target)
          visiting, visited = set(), set()
          def visit(node):
              if node in visiting:
                  raise SystemExit(f"dependency cycle detected at {node}")
              if node in visited:
                  return
              visiting.add(node)
              for dep in adjacency[node]:
                  visit(dep)
              visiting.remove(node)
              visited.add(node)
          for node in id_set:
              visit(node)
          print(f"Validated {len(repos)} repository entries and {len(edges)} dependency edges.")
          PY
