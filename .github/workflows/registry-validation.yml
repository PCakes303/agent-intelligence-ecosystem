name: Registry validation

on:
  push:
    paths:
      - "registry/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "templates/**"
      - "prototypes/**"
      - "examples/**"
      - "specifications/**"
      - "templates/**"
      - "prototypes/**"
      - "requirements-dev.txt"
      - ".github/workflows/registry-validation.yml"
  pull_request:
    paths:
      - "registry/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/registry-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate registry and dependency graph
        run: python tools/validate_registry.py
      - name: Validate resource manifest example
        run: python tools/validate_agent_resource.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
