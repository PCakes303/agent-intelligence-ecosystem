[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-swarm-compression"
version = "0.1.0"
description = "Experimental adaptive and collective information representation primitives"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MrCakes931" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
