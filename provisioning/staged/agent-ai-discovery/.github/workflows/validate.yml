name: Discovery validation
on:
  push:
    branches: [main]
    paths:
      - 'LICENSE.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'manifest.json'
      - 'capabilities.json'
      - 'compatibility.json'
      - 'llms.txt'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'LICENSE.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'manifest.json'
      - 'capabilities.json'
      - 'compatibility.json'
      - 'llms.txt'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'schemas/**'
      - 'examples/**'
      - 'tools/**'
      - 'tests/**'
      - 'requirements-dev.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Run schema-backed regression tests
        run: python -m unittest discover -s tests -v
      - name: Build example index
        run: python tools/discovery_index.py examples/discovery.json --output /tmp/discovery-index.json
